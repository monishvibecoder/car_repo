<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Big Boy Toyz</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Montserrat & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
        }
        h1, h2, h3, .logo-font {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background decorative blur shapes -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl opacity-20"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-yellow-500/10 rounded-full blur-3xl opacity-20"></div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
        <!-- Logo -->
        <a href="/" class="flex flex-col items-center leading-none mb-6">
            <span class="text-3xl font-black tracking-widest bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 bg-clip-text text-transparent logo-font">
                BIG BOY TOYZ
            </span>
            <span class="text-[0.6rem] tracking-[0.35em] text-neutral-400 font-medium mt-0.5">
                PRE-OWNED LUXURY CARS
            </span>
        </a>
        <h2 class="text-center text-3xl font-extrabold uppercase tracking-wider text-slate-100">
            Create Account
        </h2>
        <p class="mt-2 text-center text-xs uppercase tracking-wider text-neutral-500">
            Register to join the superstars club
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
        <div class="bg-neutral-900 py-8 px-4 border border-neutral-800 shadow-2xl rounded-2xl sm:px-10">
            
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                    <div class="p-3 text-xs uppercase tracking-wide rounded-xl border bg-rose-950 border-rose-900 text-rose-400">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            {% endwith %}

            <form class="space-y-6" action="/register" method="POST">
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-neutral-400">
                        Username
                    </label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required class="appearance-none block w-full px-3 py-3 bg-neutral-950 border border-neutral-800 rounded-xl shadow-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm transition-all">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-neutral-400">
                        Password
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required class="appearance-none block w-full px-3 py-3 bg-neutral-950 border border-neutral-800 rounded-xl shadow-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm transition-all">
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-xs font-bold uppercase tracking-widest text-neutral-950 bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 hover:from-amber-400 hover:to-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition-all transform active:scale-98">
                        Register
                    </button>
                </div>
            </form>

            <div class="mt-6 border-t border-neutral-800 pt-6 text-center text-xs uppercase tracking-wider">
                <span class="text-neutral-500 font-semibold">Already have an account?</span>
                <a href="/login" class="font-bold text-amber-400 hover:text-amber-500 transition-colors ml-1">
                    Sign in here &rarr;
                </a>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="text-xs text-neutral-500 hover:text-neutral-300 transition-colors uppercase tracking-wider font-semibold">
                    &larr; Back to Fleet
                </a>
            </div>
        </div>
    </div>
</body>
</html>
